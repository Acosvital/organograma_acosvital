services:
  organograma:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      API_ACOSVITAL_URL: ${API_ACOSVITAL_URL}
      API_ACOSVITAL_KEY: ${API_ACOSVITAL_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
