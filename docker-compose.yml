services:
  organograma:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # API interna (dados do organograma)
      API_ACOSVITAL_URL: ${API_ACOSVITAL_URL}
      API_ACOSVITAL_KEY: ${API_ACOSVITAL_KEY}
      # API do blog/Av-Hub (Nossa História e tela de boas-vindas)
      API_ACOSVITAL_BLOG_URL: ${API_ACOSVITAL_BLOG_URL}
      API_ACOSVITAL_BLOG_KEY: ${API_ACOSVITAL_BLOG_KEY:-}
      # Fotos/imagens (SeaweedFS)
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      # Autenticação (NextAuth). Sem NEXTAUTH_SECRET o NextAuth responde 500
      # em /api/auth/session em produção ("problem with the server
      # configuration"). NEXTAUTH_URL é a URL pública do app (usada no
      # retorno do login Microsoft).
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?defina NEXTAUTH_SECRET no .env do servidor}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      # Login com Microsoft (Azure AD)
      AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID}
      AZURE_AD_CLIENT_SECRET: ${AZURE_AD_CLIENT_SECRET}
      AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID}
